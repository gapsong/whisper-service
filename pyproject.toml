[project]
name = "whisper-service"
version = "0.1.0"
description = "Local whisper speech-to-text server for push-to-talk dictation (Apple Silicon, MLX)"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "mlx-whisper",
    "numpy",
    "silero-vad-lite>=0.2.1",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
